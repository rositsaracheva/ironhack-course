version: 2

models:
  - name: fct_orders
    description: "Orders fact table joining payments and customers"
    columns:
      - name: order_id
        description: "Primary key for orders"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to stg_customers"
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: net_amount
        description: "Net order amount (0 if refunded)"
        tests:
          - not_null
